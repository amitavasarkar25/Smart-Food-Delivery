{% extends 'base.html' %}{% block title %}Create account — SmartBite{% endblock %}{% block content %}<section class="auth-layout"><div class="auth-aside"><div class="eyebrow">JOIN SMARTBITE</div><h1>Make room for<br><em>something tasty.</em></h1><p>Create your customer account to explore dishes and track your orders.</p></div><form class="form-card" method="post"><div class="eyebrow">GET STARTED</div><h2>Create account</h2><label>Full name<input name="full_name" required maxlength="120"></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="6"></label><label>Phone<input name="phone" maxlength="30"></label><label>Delivery address<textarea name="address" rows="2"></textarea></label><button class="btn btn-primary full">Create account →</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>{% endblock %}
